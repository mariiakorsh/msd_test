name: CI

on: push

permissions:
  contents: read

jobs:
  test-and-build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.10"

      - name: Install dependencies
        run: python -m pip install -r requirements.txt
      
      - name: Run tests
        run: python -m pytest -q
        
      - name: Build Docker image
        run: docker build -t platform-demo:${{github.sha}} .

  publish:
    needs: test-and-build
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest

    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push Docker image
        run: |
          IMAGE=ghcr.io/${{ github.repository }}/platform-demo:${{ github.sha }}
          docker build -t "$IMAGE" .
          docker push "$IMAGE"

  auth-check:
    needs: publish
    runs-on: ubuntu-latest

    permissions:
      contents: read
      id-token: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Authenticate with OIDC to Google Cloud
        uses: google-github-actions/auth@v3
        with:
          workload_identity_provider: projects/265291172370/locations/global/workloadIdentityPools/github-actions/providers/github
          service_account: platform-demo-deployer@msd-test-assignment.iam.gserviceaccount.com

      - name: Set up Google Cloud SDK
        uses: google-github-actions/setup-gcloud@v3
        with:
          project_id: msd-test-assignment

      - name: Verify authentication
        run: |
          gcloud auth print-access-token >/dev/null
          echo "Google Cloud authentication succeeded"